<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste de atendimento</title><link rel="stylesheet" href="panel.css"><script src="../base1/cockpit.js" defer></script><script src="panel.js" defer></script></head>
<body><main><header><div><span class="eyebrow">Laboratório privado</span><h1>Teste de atendimento</h1></div><button type="button" id="reset">Nova conversa</button></header>
<p class="intro">Esta tela testa a IA diretamente com a base privada. Para receber a conversa e as tabelas no Chatwoot do piloto, <a href="/conversaspiloto" target="_top">abra Conversas fictícias</a>.</p>
<div id="info" role="status">Carregando configuração…</div>
<div class="suggest" aria-label="Sugestões para testar"><button type="button">Qual a diferença entre micropele e híbrida?</button><button type="button">Quanto custa a aplicação?</button><button type="button">Dá para marcar amanhã às 14h?</button><button type="button">O que faço se sentir coceira?</button></div>
<section id="messages" aria-label="Conversa de teste" aria-live="polite"></section>
<form><label for="text">Sua mensagem</label><textarea id="text" rows="3" maxlength="850" placeholder="Escreva sua pergunta sem dados pessoais…" required></textarea><div class="actions"><span id="status" role="status"></span><button id="send" type="submit" disabled>Enviar teste</button></div></form>
</main></body></html>
