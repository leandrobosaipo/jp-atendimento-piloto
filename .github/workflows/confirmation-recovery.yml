name: Confirmation recovery contracts
on:
  push:
    branches: ['codex/jp-confirmacoes-reinicio']
permissions: {contents: read}
jobs:
  isolated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.2'}
      - run: |
          python3 -m compileall -q core_ops
          python3 -m unittest discover -s core_ops -p 'test_published_answers.py'
          PYTHONPATH=integration python3 core_ops/test_public_requests.py
          python3 -m unittest discover -s core_ops -p 'test_confirmation_memory.py'
          python3 -m unittest discover -s core_ops -p 'test_receipt_reply_identity.py'
          python3 -m unittest discover -s core_ops -p 'test_receipt_capture_pending.py'
          node --test core_ops/test_central_receipt.mjs
          python3 -m unittest discover -s core_sync -p 'test_partial_directory.py'
          node --test core_ops/test_diagnostics.mjs core_ops/test_ops.mjs core_ops/test_task_reads.mjs core_ops/test_effect_guard.mjs
