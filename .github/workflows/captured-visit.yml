name: Captura de respostas da agenda JP
on:
  push:
    branches: ['codex/jp-associacao-respostas-dell','codex/jp-confirmacao-oficial-dell']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: |
          python3 -m compileall -q core_ops core_sync
          python3 core_ops/test_reply_capture.py
          python3 core_sync/test_selected_agenda.py
          python3 core_sync/test_source.py
          node core_ops/test_captured_visit.mjs
          node core_ops/test_captured_confirmation.mjs
          node --test core_ops/test_autonomous_same_day_reschedule.mjs core_ops/test_same_day_reschedule_integration.mjs core_ops/test_effect_guard.mjs core_ops/test_task_reads.mjs
          python3 core_ops/test_confirmation_permits.py
          node --test core_ops/test_reschedule_policy_wake.mjs core_ops/test_captured_reschedule_executor.mjs core_ops/test_reply_reschedule_feedback_executor.mjs core_ops/test_reschedule_full_chain.mjs
          python3 -B -m unittest discover -s core_ops -p 'test_*reschedule*.py'
          python3 core_ops/test_capture_link_schema.py
          node core_ops/test_confirmed_visit_return.mjs
