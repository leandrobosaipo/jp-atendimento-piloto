name: Confirmation recovery contracts
on:
  push:
    branches: ['codex/jp-confirmacoes-reinicio']
permissions: {contents: read}
jobs:
  isolated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.2'}
      - run: |
          python3 -m compileall -q core_ops
          node --test core_ops/test_diagnostics.mjs core_ops/test_ops.mjs core_ops/test_task_reads.mjs core_ops/test_effect_guard.mjs
