name: Validate private conversation panel
on:
  push:
    paths: ["assistant_panel/**", ".github/workflows/assistant.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate budget, replay, context and rendering source
        run: |
          python3 assistant_panel/test_gateway.py
          python3 assistant_panel/test_monthly_budget.py
          node assistant_panel/test_panel.cjs
          python3 assistant_panel/test_update.py
          node --check assistant_panel/cockpit/panel.js
          python3 -m json.tool assistant_panel/cockpit/manifest.json >/dev/null
      - name: Exercise real systemd credentials and Unix socket with private fixtures
        run: |
          sudo useradd --system --no-create-home delladmin
          sudo install -d -m 700 private/openai-inbox
          printf '%s' '{"version":"fixture","entries":[{"id":"sample","title":"Sample","source":"local","keywords":["sample"],"text":"Sample synthetic fact."}]}' | sudo tee private/openai-inbox/kb.json >/dev/null
          printf 'sk-offline%s' "$GITHUB_SHA" | sudo tee private/openai-inbox/openai.key >/dev/null
          sudo chmod 600 private/openai-inbox/kb.json private/openai-inbox/openai.key
          hash=$(sudo sha256sum private/openai-inbox/kb.json | cut -d' ' -f1)
          sudo env GITHUB_ACTIONS=true python3 assistant_panel/install.py --ci --source-commit "$GITHUB_SHA" --kb-sha256 "$hash" --apply
          test "$(stat -c '%U:%a' /run/atendimento-piloto-ai.sock)" = delladmin:600
          printf '{"op":"info"}' | sudo -u nobody /usr/local/libexec/atendimento-piloto-ai/client.py | jq -e '.code=="unavailable"'
          printf '{"op":"info"}' | sudo -u delladmin /usr/local/libexec/atendimento-piloto-ai/client.py | jq -e '.model=="gpt-6-luna" and .daily_requests==0'
          sudo env GITHUB_ACTIONS=true python3 assistant_panel/update.py --ci --source-commit "$GITHUB_SHA" --from-commit "$GITHUB_SHA" --apply
          tmp=$(mktemp)
          sudo cat private/openai-inbox/kb.json | sed 's/"version":"fixture"/"version":"fixture2"/' > "$tmp"
          new=$(sha256sum "$tmp" | cut -d' ' -f1)
          sudo install -m 600 "$tmp" "private/openai-inbox/kb-$new.json"
          sudo env GITHUB_ACTIONS=true python3 assistant_panel/update_knowledge.py --ci --source-commit "$GITHUB_SHA" --expected-old "$hash" --expected-new "$new" --apply
          printf '{"op":"info"}' | sudo -u delladmin /usr/local/libexec/atendimento-piloto-ai/client.py | jq -e '.kb_version=="fixture2" and .daily_requests==0'
