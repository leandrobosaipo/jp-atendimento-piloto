name: Validate isolated pilot
on:
  push:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Parse and boot the exact release
        run: |
          python3 -m py_compile prepare.py install.py verify.py
          bash -n init-db.sh
          python3 install.py --ci --source-commit "$GITHUB_SHA" --apply
      - name: Verify fixture persistence and isolated restores
        run: python3 verify.py
      - name: Exercise the scoped memory update on the existing fixture project
        run: |
          docker update --memory 1280m "$(docker compose ps -q flow)" >/dev/null
          python3 resize_flow.py --ci --source-commit "$GITHUB_SHA" --from-commit "$GITHUB_SHA" --apply
          test "$(docker compose exec -T postgres psql -U postgres -d flow -Atc "SELECT count(*) FROM flow WHERE name='PilotFixture0001'")" = 1
      - name: Install and exercise the synthetic intake on local n8n, Langflow and Chatwoot
        run: |
          python3 configure_flows.py --ci --source-commit "$GITHUB_SHA" --from-commit "$GITHUB_SHA" --apply
          python3 verify_flows.py
      - name: Verify integrated Chatwoot, n8n, AI gateway and image storage
        run: |
          python3 integration/test_provider.py
          python3 integration/test_policy.py
          sudo useradd --system --user-group --no-create-home delladmin
          sudo env GITHUB_ACTIONS=true GITHUB_SHA="$GITHUB_SHA" python3 integration/ci_fixtures.py
          kb=$(sudo sha256sum private/openai-inbox/kb.json | cut -d' ' -f1)
          sudo env GITHUB_ACTIONS=true python3 assistant_panel/install.py --ci --source-commit "$GITHUB_SHA" --kb-sha256 "$kb" --apply
          sudo install -d -m 755 /usr/local/libexec/ai-ci-fixture /etc/systemd/system/atendimento-piloto-ai.service.d /etc/systemd/system/atendimento-piloto-integracao.service.d
          sudo install -m 755 integration/ci_server.py integration/ci_gateway.py /usr/local/libexec/ai-ci-fixture/
          printf '[Service]\nEnvironment=PILOT_ACTIONS_FIXTURE=yes\nExecStart=\nExecStart=/usr/bin/python3 /usr/local/libexec/ai-ci-fixture/ci_gateway.py\n' | sudo tee /etc/systemd/system/atendimento-piloto-ai.service.d/90-ci.conf >/dev/null
          printf '[Service]\nEnvironment=PILOT_ACTIONS_FIXTURE=yes\nExecStart=\nExecStart=/usr/bin/python3 /usr/local/libexec/ai-ci-fixture/ci_server.py\n' | sudo tee /etc/systemd/system/atendimento-piloto-integracao.service.d/90-ci.conf >/dev/null
          assets=$(sudo sha256sum private/integration-inbox/assets.json | cut -d' ' -f1)
          sudo env GITHUB_ACTIONS=true python3 integration/install.py --ci --source-commit "$GITHUB_SHA" --manifest-sha256 "$assets" --apply
          new=$(sudo python3 -c 'import json,hashlib; x=json.load(open("private/integration-inbox/assets.json")); x["price_source_policy"]="artwork"; print(hashlib.sha256((json.dumps(x,ensure_ascii=False,indent=2)+"\n").encode()).hexdigest())')
          sudo env GITHUB_ACTIONS=true python3 integration/update.py --ci --source-commit "$GITHUB_SHA" --from-commit "$GITHUB_SHA" --old-manifest "$assets" --new-manifest "$new" --apply
          sudo env GITHUB_ACTIONS=true python3 integration/verify.py --ci
